name: CI/CD - Quality, A11y, Green IT & Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MAX_DIST_BYTES: 2097152     # 2 MiB max pour frontend/dist (Green IT)
  MAX_IMAGE_BYTES: 52428800   # 50 MiB max pour l'image finale (Green IT)

jobs:
  go-checks:
    name: Go (vet, race tests, govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Prepare embedded static placeholder
        run: |
          mkdir -p backend/static
          : > backend/static/.keep

      - name: Go vet and race tests
        working-directory: backend
        run: |
          go vet ./...
          go test -race -v ./...

      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend-green-it-a11y:
    name: Frontend (check, Vitest, Green IT & A11y)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Go (for A11y server audit)
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install dependencies, typecheck, and run Vitest
        working-directory: frontend
        run: |
          npm ci --prefer-offline || npm install
          npx --yes svelte-check --tsconfig ./tsconfig.json
          npm run check
          npm test

      - name: Build frontend and enforce Green IT bundle budget
        working-directory: frontend
        run: |
          npm run build
      
          DIST_BYTES=$(du -sb dist | awk '{print $1}')
          echo "frontend/dist size: ${DIST_BYTES} bytes (limit: ${MAX_DIST_BYTES})"
          if [ "$DIST_BYTES" -gt "$MAX_DIST_BYTES" ]; then
            echo "Green IT budget exceeded: frontend/dist (${DIST_BYTES}B) > ${MAX_DIST_BYTES}B"
            exit 1
          fi

      - name: Resolve dynamic app version
        id: ver
        run: |
          TAG_VER=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          PKG_VER=$(node -p "require('./frontend/package.json').version" 2>/dev/null || echo "0.9.4")
          RESOLVED="${TAG_VER:-$PKG_VER}"
          echo "version=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "Resolved APP_VERSION=${RESOLVED}"

      - name: Accessibility audit with Lighthouse CI
        run: |
          rm -rf backend/static
          cp -r frontend/dist backend/static
          cd backend
          APP_VERSION="${{ steps.ver.outputs.version }}" go build -ldflags="-X main.appVersion=${{ steps.ver.outputs.version }}" -o /tmp/jmap-pwa-audit .

          SESSION_SECRET="ci-lighthouse-secret-2026-enveloppe" \
          PORT="8080" \
          /tmp/jmap-pwa-audit >/tmp/jmap-pwa-audit.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -f /tmp/jmap-pwa-audit /tmp/jmap-pwa-audit.log /tmp/lhci.json' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/api/version >/dev/null 2>&1 || curl -sf http://127.0.0.1:8080/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 0.5
          done

          if [ "$READY" -ne 1 ]; then
            echo "Le serveur Go n'a pas démarré à temps :"
            cat /tmp/jmap-pwa-audit.log || true
            exit 1
          fi

          cat << 'LHJSON' > /tmp/lhci.json
          {
            "ci": {
              "collect": {
                "url": ["http://127.0.0.1:8080/"],
                "numberOfRuns": 1,
                "settings": {
                  "onlyCategories": ["accessibility"],
                  "chromeFlags": "--headless --no-sandbox --disable-dev-shm-usage"
                }
              },
              "assert": {
                "assertions": {
                  "categories:accessibility": ["error", {"minScore": 0.90}]
                }
              }
            }
          }
          LHJSON

          npx --yes @lhci/cli@0.14.x autorun --config=/tmp/lhci.json

  docker-trivy-publish:
    name: Docker Build, Green IT Size, Trivy Scan & Push
    needs: [go-checks, frontend-green-it-a11y]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Resolve dynamic app version
        id: ver
        run: |
          TAG_VER=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          PKG_VER=$(node -p "require('./frontend/package.json').version" 2>/dev/null || echo "0.9.4")
          RESOLVED="${TAG_VER:-$PKG_VER}"
          echo "version=${RESOLVED}" >> "$GITHUB_OUTPUT"

      - name: Build local image for size & Trivy audit
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: enveloppe-ci:audit
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Enforce Green IT Docker image size budget
        run: |
          IMG_BYTES=$(docker image inspect enveloppe-ci:audit --format '{{.Size}}')
          echo "Docker image size: ${IMG_BYTES} bytes (limit: ${MAX_IMAGE_BYTES})"
          if [ "$IMG_BYTES" -gt "$MAX_IMAGE_BYTES" ]; then
            echo "Green IT image size exceeded: ${IMG_BYTES}B > ${MAX_IMAGE_BYTES}B"
            exit 1
          fi

      - name: Scan image with Trivy CLI (CRITICAL & HIGH)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            enveloppe-ci:audit

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
