services:
  enveloppe:
    image: ghcr.io/boris22100/enveloppe:latest
    container_name: enveloppe
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "8089:8080"
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
